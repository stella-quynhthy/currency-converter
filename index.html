<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currecy Converter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Currecy Converter</h1>
    <div id="conversion">
        <p>USD = EUR</p>
        <input type="number" id="amount" placeholder="Enter amount in USD"> <br>
        <select id="diffCurrency">
            <option value="EUR">Select currency</option>
        </select> <br>
        <button id="convertBtn">Convert</button>
    </div>
    <p id="message"></p>
    <script src="script.js"></script>
</body>
</html>
